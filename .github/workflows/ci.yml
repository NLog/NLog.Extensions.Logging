name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      force_nuget_publish:
        description: Force NuGet publish # for non-master. The package version gets a suffix. See Create NuGet Package step
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: NLog.Extensions.Logging.slnx

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Build & test (Windows)
            framework_args:
            upload_coverage: false
            aot_test_runtime: win-x64
          - os: ubuntu-latest
            name: Build & test (Ubuntu, .NET 10)
            framework_args: --framework net10.0
            coverage_args: --collect:"XPlat Code Coverage"
            upload_coverage: true
            aot_test_runtime: linux-x64
          - os: ubuntu-latest
            name: Build & test (Ubuntu, .NET 11)
            framework_args: --framework net11.0
            coverage_args: --collect:"XPlat Code Coverage"
            upload_coverage: true
            aot_test_runtime: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          check-latest: false

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore ${{ matrix.framework_args }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-restore --no-build ${{ matrix.framework_args }} ${{ matrix.coverage_args }} --logger GitHubActions

      - name: Upload coverage to Codecov
        if: matrix.upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # https://github.com/codecov/codecov-action/releases/tag/v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Needed for protected branches
          files: test/**/TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Publish example (AOT/self-contained check)
        run: dotnet publish examples/HostingExample --framework net11.0 -r ${{ matrix.aot_test_runtime }} --configuration Release --self-contained

  roslyn-analysis: # Run Roslyn analysis and upload to GitHub Code Scanning
    name: Roslyn analysis (.NET 11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          check-latest: false

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Prepare Roslyn SARIF directory
        run: mkdir -p '${{ runner.temp }}/roslyn'

      - name: Build with Roslyn SARIF output
        run: dotnet build ${{ env.SOLUTION }} --framework net11.0 --configuration Release --no-restore -p:RoslynSarif=true -p:TreatWarningsAsErrors=false -p:RoslynSarifDirectory='${{ runner.temp }}/roslyn'

      - name: Upload Roslyn findings (NLog.Extensions.Hosting)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/NLog.Extensions.Hosting-net11.0.sarif'
          category: roslyn-NLog.Extensions.Hosting

      - name: Upload Roslyn findings (NLog.Extensions.Logging)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/NLog.Extensions.Logging-net11.0.sarif'
          category: roslyn-NLog.Extensions.Logging

      - name: Upload Roslyn findings (NLog.Extensions.Hosting.Tests)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/NLog.Extensions.Hosting.Tests-net11.0.sarif'
          category: roslyn-NLog.Extensions.Hosting.Tests

      - name: Upload Roslyn findings (NLog.Extensions.Logging.Tests)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/NLog.Extensions.Logging.Tests-net11.0.sarif'
          category: roslyn-NLog.Extensions.Logging.Tests

      - name: Upload Roslyn findings (ConsoleExample)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/ConsoleExample-net11.0.sarif'
          category: roslyn-ConsoleExample

      - name: Upload Roslyn findings (ConsoleExampleJsonConfig)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/ConsoleExampleJsonConfig-net11.0.sarif'
          category: roslyn-ConsoleExampleJsonConfig

      - name: Upload Roslyn findings (HostingExample)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/roslyn/HostingExample-net11.0.sarif'
          category: roslyn-HostingExample

  validate-slnx:
    name: Validate SLNX
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate solution
        run: |
          dotnet tool install --tool-path ./.tools slnx-validator --version 0.6.0
          ./.tools/slnx-validator "$SOLUTION"

  pack:
    name: Create NuGet package
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          check-latest: false

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Determine version suffix
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF -eq "refs/heads/master") {
            echo "suffix=" >> $env:GITHUB_OUTPUT
          } elseif ($env:PR_NUMBER) {
            echo "suffix=pr.$($env:PR_NUMBER).ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          } else {
            echo "suffix=ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          }

      - name: Create NuGet package
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
        run: dotnet pack $env:SOLUTION --no-restore --configuration Release --output artifacts -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:EmbedUntrackedSources=true -p:ContinuousIntegrationBuild=true --version-suffix "$env:VERSION_SUFFIX"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish NuGet package
    needs: [build, pack, validate-slnx]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_nuget_publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: NuGetPackages
          path: artifacts

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
